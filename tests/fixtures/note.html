<p>土曜日の朝、ベランダの温度を同じ温度計で測りました。午前六時には十二度、八時には十五度でした。測定場所は東向きの手すりから一メートル離れた日陰に固定しました。</p><h2>測り方と気づき</h2><p>最初は直射日光の当たる場所に置いていたため、日陰より三度高く表示されました。場所を揃えてからは、隣の温度計との差が一度以内になりました。<br>翌日も同じ条件で観測する予定です。</p>
